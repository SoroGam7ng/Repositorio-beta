<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
</head>
<body>

    <h2>Calculadora</h2>
    <p>Introduce números enteros entre -99999 y 99999</p>

    <form>
        <label>Primer número:</label>
        <input type="number" min="-99999" max="99999" required>
        <br><br>

        <label>Segundo número:</label>
        <input type="number" min="-99999" max="99999" required>
        <br><br>

        <label>Operación:</label>
        <select>
            <option>Suma</option>
            <option>Resta</option>
            <option>Multiplicación</option>
            <option>Potencia</option>
        </select>
        <br><br>

        <button type="submit">Calcular</button>
    </form>

</body>
</html>
